<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stránka sa nenašla — Chiara Kubek</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#16110f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Manrope:wght@300..600&display=swap">
  <!-- 404 can be served from any URL depth, so styles are inline instead of a relative stylesheet link. -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 70% 20%, rgba(200, 115, 74, 0.22), transparent 55%), #16110f;
      color: #efe4d6;
      font-family: "Manrope", system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
      animation: in 900ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }
    p { color: #a8988a; }
    .code { font-size: 0.75rem; letter-spacing: 0.25em; }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 400;
      font-size: clamp(2.5rem, 8vw, 5rem);
      margin: 0.5rem 0 1rem;
    }
    a {
      color: #d9a05b;
      text-decoration: none;
      border-bottom: 1px solid #c8734a;
    }
    @keyframes in { from { opacity: 0; transform: translateY(12px); } }
    @media (prefers-reduced-motion: reduce) { body { animation: none; } }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Stránka sa nenašla</h1>
    <p>Hľadaná stránka neexistuje alebo bola presunutá.</p>
    <p><a id="home" href="/">← späť na úvod</a></p>
  </main>
  <script>
    // On a GitHub project page the site lives under /<repo>/, not the domain root.
    if (/\.github\.io$/.test(location.hostname)) {
      var first = location.pathname.split("/")[1];
      var isUserSite = location.hostname.split(".")[0] === first;
      if (first && !isUserSite) document.getElementById("home").href = "/" + first + "/";
    }
  </script>
</body>
</html>
